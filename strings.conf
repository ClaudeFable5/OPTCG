#OPCG 커스텀 선택 안내문(HINT_SELECTMSG용 !system 스트링)
#ID는 0x100000 미만이어야 클라이언트 GetDesc가 시스템 스트링으로 해석한다
#(공식 strings.conf는 ~12125까지 사용; 880010대는 빈 영역).
!system 880010 -3000할 캐릭터를 골라주세요
!system 880011 -2000할 캐릭터를 골라주세요
!system 880012 KO할 캐릭터를 골라주세요
#OP16 신규 특징(공식 config strings.conf에 없는 것만 — 저장소 갱신으로 배포)
!setname 0xb5 대장
#OP17·ST31~36 신규 특징(2026-08-28)
!setname 0xb6 거병 해적단
!setname 0xb7 시케아르 왕국
!setname 0xb8 카리부 해적단
!setname 0xb9 빨간 머리 해적단 산하
#록스 해적단(0xab): EB03 투입 때 코드만 배정되고 setname이 클라 스톡·저장소
#어디에도 등록된 적 없던 잠복 누락 — OP17 록스 16장으로 표면화(특징란 ???).
#전 cdb 특징코드 커버리지 감사로 확인된 유일한 무명 코드(2026-08-28).
!setname 0xab 록스 해적단
#UI 설정 라벨(rev31 클라이언트가 소비)
!system 880013 별쇄 일러스트 숨기기
!system 880014 턴 종료
#선공/후공 한글화 - 스톡 100/101 덮어쓰기(멀리건 배너 + 선후공 선택창 공용).
#rev36 멀리건 배너는 이 id를 그대로 읽으므로 미갱신 클라도 영어로 폴백될 뿐 ??? 없음
!system 100 선공
!system 101 후공
#덱 검증 오류 - 리더 색 불일치(rev39 클라 + Multiroptcg CheckDeck, %ls=카드명)
!system 880050 "%ls"은(는) 리더의 색과 맞지 않아 덱에 넣을 수 없습니다.
#자동업데이트 적용/재실행 실패 안내(rev42 클라)
!system 880060 업데이트를 적용하지 못했습니다. 게임을 껐다가 다시 실행해 주세요. (백신이 새 파일을 검사 중이면 잠시 후 다시 시도)
#블록 아이콘 필터(rev43 덱 에디터 우상단 콤보) + 금제 등급 한글화(스톡 1315-1317 덮어쓰기)
!system 880061 1블록
!system 880062 2블록
!system 880063 3블록
!system 880064 4블록
!system 880065 5블록
!system 880066 "%ls"와(과) "%ls"은(는) 금지 페어입니다. 같은 덱에 함께 넣을 수 없습니다.
!system 1315 블록:
!system 1316 금지
!system 1317 제한(1장)
#상태 부여 호버 툴팁(opcg_contract_ops.lua STATUS_HINT_DESC와 짝 — 2026-08-12)
!system 880020 어택 불가
!system 880021 리더 어택 불가
!system 880022 리프레시 시 액티브 되지 않음
!system 880023 레스트 되지 않음
!system 880024 필드에서 벗어나지 않음
!system 880025 블로커 발동 불가
!system 880026 어택 대상으로 선택되지 않음
!system 880027 KO되지 않음
!system 880028 효과로 KO되지 않음
!system 880029 배틀로 KO되지 않음
