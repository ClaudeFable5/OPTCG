#OPCG 커스텀 선택 안내문(HINT_SELECTMSG용 !system 스트링)
#ID는 0x100000 미만이어야 클라이언트 GetDesc가 시스템 스트링으로 해석한다
#(공식 strings.conf는 ~12125까지 사용; 880010대는 빈 영역).
!system 880010 -3000할 캐릭터를 골라주세요
!system 880011 -2000할 캐릭터를 골라주세요
!system 880012 KO할 캐릭터를 골라주세요
#OP16 신규 특징(공식 config strings.conf에 없는 것만 — 저장소 갱신으로 배포)
!setname 0xb5 대장
